<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17191d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Surface lab · Lunar Explorer</title>
    <link rel="stylesheet" href="./src/surface-lab/surface-lab.css" />
  </head>
  <body>
    <header>
      <div class="title"><img src="./favicon.svg" alt="" width="28" height="28" /><h1>Surface lab</h1></div>
      <fieldset class="mode-switch" aria-label="Material view">
        <label><input type="radio" name="mode" value="game" /><span id="reference-tab">Original</span></label>
        <label><input type="radio" name="mode" value="compare" checked /><span>Compare</span></label>
        <label><input type="radio" name="mode" value="candidate" /><span id="solo-label">Refined</span></label>
      </fieldset>
      <a class="back" href="./">Back to game</a>
    </header>
    <main>
      <div id="stage" data-mode="compare">
        <canvas id="ground" tabindex="0" aria-label="Lunar ground. Drag or use arrow keys to pan. Scroll or pinch to zoom."></canvas>
        <div id="reference-label" class="pane-caption game-caption">Original material</div>
        <div id="candidate-label" class="pane-caption field-caption">Refined flight material</div>
        <div id="scale" aria-label="Ground scale at the centre of the view"><span id="scale-label"></span><i></i></div>
        <div id="stage-status" role="status">Preparing the terrain materials…</div>
      </div>
      <section class="controls" aria-label="Surface controls">
        <div class="control altitude">
          <label for="height">Altitude <output id="height-value" for="height"></output></label>
          <input id="height" type="range" min="-2" max="11.9657843" step="0.005" />
          <div class="presets" aria-label="Altitude presets">
            <button data-height="1">1 m</button><button data-height="8">8 m</button><button data-height="32">32 m</button><button data-height="250">250 m</button><button data-height="2000">2 km</button>
          </div>
        </div>
        <div class="selects">
          <label for="variant">Candidate</label><select id="variant"><option value="flight">Refined</option><option value="pebbles">Pebbles</option><option value="hybrid">Hybrid grain</option><option value="procedural">Procedural</option></select>
          <label for="angle">Camera</label><select id="angle"><option value="overhead">Overhead</option><option value="oblique">Oblique</option><option value="grazing">Grazing</option></select>
          <label for="channel">Channel</label><select id="channel"><option value="lit">Sunlit</option><option value="albedo">Albedo</option><option value="normals">Normals</option></select>
        </div>
        <div class="sliders">
          <label for="sun">Sun elevation <output id="sun-value" for="sun"></output></label>
          <input id="sun" type="range" min="6" max="78" step="1" />
          <label for="relief"><span id="relief-label">Candidate relief</span> <output id="relief-value" for="relief"></output></label>
          <input id="relief" type="range" min="0" max="2" step="0.05" />
        </div>
        <div class="timing">
          <button id="measure" disabled>Time both materials</button>
          <p id="timing" role="status">Median of 7 draws each at 512 × 512.</p>
        </div>
      </section>
    </main>
    <footer>
      <span class="hint">Drag to pan · Scroll or pinch to zoom</span>
      <span id="position"></span>
      <button id="copy">Copy view link</button>
    </footer>
    <script type="module" src="./src/surface-lab/main.ts"></script>
  </body>
</html>
